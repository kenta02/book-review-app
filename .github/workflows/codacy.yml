name: Codacy Coverage Upload

# CI ワークフロー（ci.yml）完了後に実行される Codacy 連携用ワークフロー
# このワークフローは、CI が成功している場合のみ coverage を Codacy に送信します。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  upload-coverage:
    # CI が成功したときのみこのジョブを実行
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASS: test_pass
      DB_HOST: 127.0.0.1
      DB_PORT: 1
      JWT_SECRET: test-jwt-secret

    steps:
      # リポジトリをチェックアウトする
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # CI を実行したコミットをチェックアウトする
          ref: ${{ github.event.workflow_run.head_sha }}

      # Node.js をセットアップする
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # トークン未設定のリポジトリでは送信をスキップする。
      - name: Generate coverage reports
        if: env.CODACY_PROJECT_TOKEN != ''
        run: |
          pnpm --filter server run coverage:ci
          pnpm --filter client exec vitest --run --coverage
          sed -i 's|^SF:|SF:server/|' server/coverage/lcov.info
          sed -i 's|^SF:|SF:client/|' client/coverage/lcov.info

      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@v1
        env:
          CODACY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: server/coverage/lcov.info,client/coverage/lcov.info
