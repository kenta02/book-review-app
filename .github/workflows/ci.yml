name: CI

# このワークフローは push と pull_request に反応し、
# メインの開発ブランチ（main/develop）で実行されます。
# テスト、lint、型チェックを両方のパッケージ（server/client）に対して行います。

# run on push and pull request for primary development branches
# （プッシュとプルリクエスト時に動作）

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      # リポジトリのソースをチェックアウトします
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub Actions で Node.js のバージョンをセットアップします
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ----- backend -----
      # サーバーサイド（./server）に対するステップ

      # workspace 全体の依存パッケージをインストールします
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace lockfile
        run: pnpm run test

      # サーバーコードに対して ESLint を実行します
      - name: Lint server
        working-directory: ./server
        run: pnpm run lint

      # サーバーコードの TypeScript 型チェックを実行します
      - name: Type‑check server
        working-directory: ./server
        run: pnpm run check-types

      # サーバーのユニットテストとカバレッジ測定を実行します
      - name: Run server unit tests
        working-directory: ./server
        run: |
          mkdir -p coverage/.tmp
          pnpm run test:ci-parity

      # ----- frontend -----
      # クライアントサイド（./client）に対するステップ

      # クライアントコードに対して ESLint を実行します
      - name: Lint client
        working-directory: ./client
        run: pnpm run lint

      # クライアントのユニットテストとカバレッジ測定を実行します
      - name: Run client unit tests with coverage
        working-directory: ./client
        run: pnpm exec vitest --run --coverage

      # クライアントの TypeScript 型チェックを実行します
      - name: Type‑check client
        working-directory: ./client
        run: pnpm exec tsc --noEmit
