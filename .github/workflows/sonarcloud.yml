name: SonarCloud Analysis

on: workflow_dispatch

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    strategy:
      matrix:
        node-version: [24]
    # GitHub は 2026/6 から Node.js 24 をデフォルトにする予定なので
    # actions/checkout・actions/setup-node 等は適宜バージョンアップしてください。
    # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 環境変数で先行切り替えも可能。

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud用：完全な履歴を取得

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # バックエンド分析
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        working-directory: ./server
        run: pnpm run build

      - name: Run server tests with coverage
        working-directory: ./server
        env:
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASS: test_pass
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          JWT_SECRET: test-jwt-secret
        run: pnpm run coverage:ci

      # フロントエンド分析

      - name: Build client
        working-directory: ./client
        run: pnpm run build

      - name: Validate SonarCloud configuration
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is not configured for this repository."
            echo "Add SONAR_TOKEN to GitHub Actions secrets before running SonarCloud analysis."
            exit 1
          fi

      # SonarCloud スキャン
      - name: SonarCloud Scan
        # sonarcloud-github-action は廃止済みのため、公式後継へ移行
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
