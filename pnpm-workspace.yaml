packages:
  - client
  - server

# ネイティブ依存のインストールに必要なスクリプトのみ許可する。
allowBuilds:
  bcrypt: true
  sqlite3: true
  unrs-resolver: true
  # 利用統計の送信スクリプトは実行しない。
  "@scarf/scarf": false

fetchTimeout: 60000
strictSsl: true
updateNotifier: false

# Vitest 4.1.2 が同じバージョンの coverage provider を解決できるよう補完する。
packageExtensions:
  "vitest@4.1.2":
    peerDependencies:
      "@vitest/coverage-v8": "4.1.2"
    peerDependenciesMeta:
      "@vitest/coverage-v8":
        optional: true
